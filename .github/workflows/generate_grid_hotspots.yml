name: Generate Grid Hotspots

on:
  schedule:
    - cron: '0 2 1 * *'  # First day of every month at 2am UTC
  workflow_dispatch:       # Manual trigger button in GitHub

jobs:
  run-r-script:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2 hour cap

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
      

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install R packages
        run: |
          install.packages(c("jsonlite", "dplyr", "tibble", "httr"))
        shell: Rscript {0}

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: Rscript backend/Scripts/generate_grid_hotspots.R
