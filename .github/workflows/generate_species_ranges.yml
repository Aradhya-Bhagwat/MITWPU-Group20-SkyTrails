name: Generate Species Ranges

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2am UTC
  workflow_dispatch:       # Manual trigger button in GitHub

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libudunits2-dev

      - name: Install R packages
        run: |
          install.packages(c("jsonlite", "dplyr", "stringr", "tibble"))
          install.packages("sf", repos = "https://cran.r-project.org")
          install.packages("ebirdst", repos = "https://cran.r-project.org")
        shell: Rscript {0}

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBIRD_STATUS_TRENDS_ACCESS_KEY: ${{ secrets.EBIRD_STATUS_TRENDS_ACCESS_KEY }}
          EBIRD_STATUS_TRENDS_DATA_DIR: ${{ runner.temp }}/ebirdst_data
        run: Rscript backend/Scripts/generate_species_ranges.R
